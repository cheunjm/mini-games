<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Tic-Tac-Toe</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #0a0e27;
            font-family: 'Courier New', monospace;
            color: #00e5ff;
        }

        .container { text-align: center; padding: 20px; }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 8px;
            color: #00e5ff;
            text-shadow: 0 0 10px #00e5ff, 0 0 20px #00e5ff, 0 0 40px #7c4dff;
            letter-spacing: 3px;
            animation: title-glow 3s ease-in-out infinite;
        }

        @keyframes title-glow {
            0%, 100% { text-shadow: 0 0 10px #00e5ff, 0 0 20px #00e5ff, 0 0 40px #7c4dff; }
            50% { text-shadow: 0 0 15px #00e5ff, 0 0 30px #00e5ff, 0 0 50px #7c4dff, 0 0 60px #ff006e; }
        }

        .status {
            font-size: 1.2rem;
            margin-bottom: 20px;
            color: #b388ff;
            text-shadow: 0 0 8px #7c4dff;
            min-height: 28px;
            transition: color 0.3s;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            width: 324px;
            margin: 0 auto 24px;
            padding: 12px;
            border: 2px solid #7c4dff;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(124, 77, 255, 0.4), 0 0 40px rgba(0, 229, 255, 0.15), inset 0 0 20px rgba(124, 77, 255, 0.1);
        }

        .cell {
            width: 96px;
            height: 96px;
            background: linear-gradient(135deg, #141937 0%, #0d1126 100%);
            border: 2px solid rgba(124, 77, 255, 0.5);
            border-radius: 8px;
            font-size: 2.8rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
        }

        .cell::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle, rgba(0, 229, 255, 0.08) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.2s;
        }

        .cell:hover:not(.filled)::before { opacity: 1; }

        .cell:hover:not(.filled) {
            border-color: #00e5ff;
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.4), inset 0 0 10px rgba(0, 229, 255, 0.1);
        }

        .cell.filled { cursor: default; }

        .cell.x {
            color: #ff006e;
            text-shadow: 0 0 10px #ff006e, 0 0 25px rgba(255, 0, 110, 0.5);
            animation: place 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .cell.o {
            color: #00e5ff;
            text-shadow: 0 0 10px #00e5ff, 0 0 25px rgba(0, 229, 255, 0.5);
            animation: place 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes place {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .cell.win {
            animation: win-flash 0.5s ease-in-out 3;
            border-color: #ffea00;
            box-shadow: 0 0 20px rgba(255, 234, 0, 0.5);
        }

        @keyframes win-flash {
            0%, 100% { text-shadow: 0 0 10px currentColor, 0 0 25px currentColor; }
            50% { text-shadow: 0 0 20px #ffea00, 0 0 40px #ffea00; color: #ffea00; }
        }

        .stats {
            display: flex;
            gap: 32px;
            justify-content: center;
            margin-bottom: 24px;
        }

        .stat-label {
            font-size: 0.8rem;
            color: #7c4dff;
            text-shadow: 0 0 5px rgba(124, 77, 255, 0.5);
            margin-bottom: 2px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-value {
            font-size: 1.8rem;
            font-weight: bold;
        }

        .stat-value.x-color { color: #ff006e; text-shadow: 0 0 8px rgba(255, 0, 110, 0.5); }
        .stat-value.o-color { color: #00e5ff; text-shadow: 0 0 8px rgba(0, 229, 255, 0.5); }
        .stat-value.d-color { color: #b388ff; text-shadow: 0 0 8px rgba(179, 136, 255, 0.5); }

        .buttons { display: flex; gap: 12px; justify-content: center; }

        button {
            padding: 10px 24px;
            font-size: 0.95rem;
            font-family: 'Courier New', monospace;
            background: transparent;
            color: #00e5ff;
            border: 2px solid #00e5ff;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-shadow: 0 0 5px rgba(0, 229, 255, 0.5);
        }

        button:hover {
            background: rgba(0, 229, 255, 0.1);
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.4);
        }

        button:active { transform: scale(0.97); }

        button.danger {
            color: #ff006e;
            border-color: rgba(255, 0, 110, 0.5);
            text-shadow: 0 0 5px rgba(255, 0, 110, 0.3);
        }

        button.danger:hover {
            background: rgba(255, 0, 110, 0.1);
            border-color: #ff006e;
            box-shadow: 0 0 15px rgba(255, 0, 110, 0.3);
        }

        @media (max-width: 420px) {
            h1 { font-size: 1.8rem; }
            .board { width: 264px; }
            .cell { width: 76px; height: 76px; font-size: 2.2rem; }
            .stats { gap: 20px; }
            .stat-value { font-size: 1.4rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>TIC-TAC-TOE</h1>
        <div class="status" id="status">X's turn</div>
        <div class="board" id="board"></div>
        <div class="stats">
            <div>
                <div class="stat-label">X wins</div>
                <div class="stat-value x-color" id="xWins">0</div>
            </div>
            <div>
                <div class="stat-label">Draws</div>
                <div class="stat-value d-color" id="draws">0</div>
            </div>
            <div>
                <div class="stat-label">O wins</div>
                <div class="stat-value o-color" id="oWins">0</div>
            </div>
        </div>
        <div class="buttons">
            <button id="newGame">New Game</button>
            <button id="resetStats" class="danger">Reset Stats</button>
        </div>
    </div>

    <script>
        const WINS = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
        const board = document.getElementById('board');
        const statusEl = document.getElementById('status');
        let cells, state, turn, active;

        const stats = JSON.parse(localStorage.getItem('ttt-stats') || '{"x":0,"o":0,"d":0}');

        function updateStats() {
            document.getElementById('xWins').textContent = stats.x;
            document.getElementById('oWins').textContent = stats.o;
            document.getElementById('draws').textContent = stats.d;
            localStorage.setItem('ttt-stats', JSON.stringify(stats));
        }

        function init() {
            board.innerHTML = Array(9).fill('<div class="cell"></div>').join('');
            cells = board.querySelectorAll('.cell');
            state = Array(9).fill('');
            turn = 'X';
            active = true;
            statusEl.textContent = "X's turn";
            statusEl.style.color = '#ff006e';
            cells.forEach((c, i) => c.addEventListener('click', () => play(i)));
        }

        function play(i) {
            if (!active || state[i]) return;
            state[i] = turn;
            cells[i].textContent = turn;
            cells[i].classList.add(turn.toLowerCase(), 'filled');

            const winCombo = WINS.find(([a,b,c]) => state[a] && state[a] === state[b] && state[a] === state[c]);
            if (winCombo) {
                active = false;
                winCombo.forEach(j => cells[j].classList.add('win'));
                statusEl.textContent = turn + ' wins!';
                statusEl.style.color = '#ffea00';
                stats[turn.toLowerCase()]++;
                updateStats();
                return;
            }

            if (state.every(s => s)) {
                active = false;
                statusEl.textContent = 'Draw!';
                statusEl.style.color = '#b388ff';
                stats.d++;
                updateStats();
                return;
            }

            turn = turn === 'X' ? 'O' : 'X';
            statusEl.textContent = turn + "'s turn";
            statusEl.style.color = turn === 'X' ? '#ff006e' : '#00e5ff';
        }

        document.getElementById('newGame').addEventListener('click', init);
        document.getElementById('resetStats').addEventListener('click', function() {
            stats.x = stats.o = stats.d = 0;
            updateStats();
            init();
        });

        updateStats();
        init();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark Neon Tic-Tac-Toe</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #0a0e27;
            font-family: 'Courier New', monospace;
            color: #00ff9f;
        }

        .container {
            text-align: center;
            padding: 20px;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: #00ff9f;
            text-shadow: 0 0 10px #00ff9f, 0 0 20px #00ff9f, 0 0 30px #0080ff;
            letter-spacing: 2px;
            animation: glow-pulse 2s ease-in-out infinite;
        }

        @keyframes glow-pulse {
            0%, 100% {
                text-shadow: 0 0 10px #00ff9f, 0 0 20px #00ff9f, 0 0 30px #0080ff;
            }
            50% {
                text-shadow: 0 0 20px #00ff9f, 0 0 30px #00ff9f, 0 0 40px #0080ff, 0 0 50px #ff006e;
            }
        }

        .info {
            font-size: 1.2rem;
            margin-bottom: 20px;
            color: #0080ff;
            text-shadow: 0 0 5px #0080ff;
            min-height: 24px;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            grid-gap: 8px;
            margin: 30px auto;
            background: #0a0e27;
            padding: 15px;
            border: 2px solid #00ff9f;
            border-radius: 10px;
            box-shadow: 0 0 20px #00ff9f, 0 0 40px #0080ff, inset 0 0 20px rgba(0, 255, 159, 0.1);
        }

        .cell {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, #1a1f3a 0%, #0f1629 100%);
            border: 2px solid #00ff9f;
            border-radius: 5px;
            font-size: 2.5rem;
            font-weight: bold;
            cursor: pointer;
            color: #00ff9f;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            text-shadow: 0 0 10px #00ff9f;
            box-shadow: 0 0 10px rgba(0, 255, 159, 0.3), inset 0 0 10px rgba(0, 255, 159, 0.1);
        }

        .cell:hover:not([data-filled]) {
            background: linear-gradient(135deg, #2a2f4a 0%, #1f2639 100%);
            box-shadow: 0 0 20px #00ff9f, 0 0 30px #0080ff, inset 0 0 15px rgba(0, 255, 159, 0.2);
            color: #00ffff;
            text-shadow: 0 0 15px #00ffff, 0 0 20px #0080ff;
        }

        .cell[data-filled] {
            cursor: not-allowed;
            box-shadow: 0 0 15px #00ff9f, inset 0 0 10px rgba(0, 255, 159, 0.2);
        }

        .cell.x {
            color: #ff006e;
            text-shadow: 0 0 10px #ff006e, 0 0 20px #ff0055;
        }

        .cell.o {
            color: #0080ff;
            text-shadow: 0 0 10px #0080ff, 0 0 20px #005eff;
        }

        .cell.winner {
            animation: winner-flash 0.6s ease-in-out 3;
            border-color: #ffff00;
        }

        @keyframes winner-flash {
            0%, 100% {
                text-shadow: 0 0 10px currentColor, 0 0 20px currentColor;
            }
            50% {
                text-shadow: 0 0 20px currentColor, 0 0 30px currentColor, 0 0 40px #ffff00;
                color: #ffff00;
            }
        }

        .buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 25px;
            font-size: 1rem;
            font-family: 'Courier New', monospace;
            background: #0a0e27;
            color: #00ff9f;
            border: 2px solid #00ff9f;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-shadow: 0 0 5px #00ff9f;
            box-shadow: 0 0 10px rgba(0, 255, 159, 0.3);
        }

        button:hover {
            background: rgba(0, 255, 159, 0.1);
            box-shadow: 0 0 20px #00ff9f, 0 0 30px #0080ff;
            color: #00ffff;
            text-shadow: 0 0 10px #00ffff, 0 0 15px #00ff9f;
        }

        button:active {
            transform: scale(0.98);
        }

        .stats {
            display: flex;
            gap: 30px;
            justify-content: center;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .stat {
            text-align: center;
        }

        .stat-label {
            font-size: 0.9rem;
            color: #0080ff;
            text-shadow: 0 0 5px #0080ff;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 1.8rem;
            font-weight: bold;
            color: #00ff9f;
            text-shadow: 0 0 10px #00ff9f;
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 1.8rem;
            }

            .board {
                grid-template-columns: repeat(3, 80px);
                grid-gap: 6px;
                padding: 10px;
            }

            .cell {
                width: 80px;
                height: 80px;
                font-size: 2rem;
            }

            button {
                padding: 10px 20px;
                font-size: 0.9rem;
            }

            .stat-value {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>NEON TIC-TAC-TOE</h1>
        <div class="info" id="info">Press Start to Begin</div>
        
        <div class="board" id="board">
            <div class="cell" data-index="0"></div>
            <div class="cell" data-index="1"></div>
            <div class="cell" data-index="2"></div>
            <div class="cell" data-index="3"></div>
            <div class="cell" data-index="4"></div>
            <div class="cell" data-index="5"></div>
            <div class="cell" data-index="6"></div>
            <div class="cell" data-index="7"></div>
            <div class="cell" data-index="8"></div>
        </div>

        <div class="stats">
            <div class="stat">
                <div class="stat-label">X Wins</div>
                <div class="stat-value" id="xWins">0</div>
            </div>
            <div class="stat">
                <div class="stat-label">Draws</div>
                <div class="stat-value" id="draws">0</div>
            </div>
            <div class="stat">
                <div class="stat-label">O Wins</div>
                <div class="stat-value" id="oWins">0</div>
            </div>
        </div>

        <div class="buttons">
            <button id="startBtn">Start Game</button>
            <button id="resetBtn">Reset Stats</button>
        </div>
    </div>

    <script>
        const WINNING_COMBINATIONS = [
            [0, 1, 2],
            [3, 4, 5],
            [6, 7, 8],
            [0, 3, 6],
            [1, 4, 7],
            [2, 5, 8],
            [0, 4, 8],
            [2, 4, 6]
        ];

        let board = Array(9).fill(null);
        let currentPlayer = 'X';
        let gameActive = false;
        let gameEnded = false;
        let stats = {
            xWins: 0,
            draws: 0,
            oWins: 0
        };

        const cells = document.querySelectorAll('.cell');
        const infoDiv = document.getElementById('info');
        const startBtn = document.getElementById('startBtn');
        const resetBtn = document.getElementById('resetBtn');
        const xWinsDisplay = document.getElementById('xWins');
        const drawsDisplay = document.getElementById('draws');
        const oWinsDisplay = document.getElementById('oWins');

        // Load stats from localStorage
        function loadStats() {
            const saved = localStorage.getItem('tictactoeStats');
            if (saved) {
                stats = JSON.parse(saved);
                updateStatsDisplay();
            }
        }

        // Save stats to localStorage
        function saveStats() {
            localStorage.setItem('tictactoeStats', JSON.stringify(stats));
        }

        // Update stats display
        function updateStatsDisplay() {
            xWinsDisplay.textContent = stats.xWins;
            drawsDisplay.textContent = stats.draws;
            oWinsDisplay.textContent = stats.oWins;
        }

        // Check for winner
        function checkWinner() {
            for (let combo of WINNING_COMBINATIONS) {
                const [a, b, c] = combo;
                if (board[a] && board[a] === board[b] && board[a] === board[c]) {
                    return { winner: board[a], combo };
                }
            }
            return null;
        }

        // Check for draw
        function checkDraw() {
            return board.every(cell => cell !== null);
        }

        // End game
        function endGame(result) {
            gameEnded = true;
            gameActive = false;

            if (result.winner) {
                infoDiv.textContent = `🎉 Player ${result.winner} Wins!`;
                if (result.winner === 'X') {
                    stats.xWins++;
                } else {
                    stats.oWins++;
                }
                // Highlight winning cells
                result.combo.forEach(index => {
                    cells[index].classList.add('winner');
                });
            } else {
                infoDiv.textContent = "🤝 It's a Draw!";
                stats.draws++;
            }

            saveStats();
            updateStatsDisplay();
            startBtn.textContent = 'Play Again';
        }

        // Handle cell click
        function handleCellClick(e) {
            if (!gameActive || gameEnded) return;

            const cell = e.target;
            const index = parseInt(cell.dataset.index);

            if (board[index] !== null) return;

            board[index] = currentPlayer;
            cell.textContent = currentPlayer;
            cell.classList.add(currentPlayer.toLowerCase());
            cell.dataset.filled = 'true';

            // Check for winner
            const result = checkWinner();
            if (result) {
                endGame(result);
                return;
            }

            // Check for draw
            if (checkDraw()) {
                endGame({ winner: null });
                return;
            }

            // Switch player
            currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
            infoDiv.textContent = `Player ${currentPlayer}'s Turn`;
        }

        // Start new game
        function startNewGame() {
            board = Array(9).fill(null);
            currentPlayer = 'X';
            gameActive = true;
            gameEnded = false;
            infoDiv.textContent = "Player X's Turn";
            startBtn.textContent = 'Start Game';

            cells.forEach(cell => {
                cell.textContent = '';
                cell.className = 'cell';
                cell.dataset.filled = '';
            });
        }

        // Reset stats
        function resetStats() {
            if (confirm('Are you sure? This will reset all statistics.')) {
                stats = { xWins: 0, draws: 0, oWins: 0 };
                saveStats();
                updateStatsDisplay();
                startNewGame();
            }
        }

        // Event listeners
        startBtn.addEventListener('click', startNewGame);
        resetBtn.addEventListener('click', resetStats);
        cells.forEach(cell => cell.addEventListener('click', handleCellClick));

        // Initialize
        loadStats();
    </script>
</body>
</html>
